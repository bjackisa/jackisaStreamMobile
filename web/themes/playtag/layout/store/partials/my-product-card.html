<div class="store_card store_card_dash content" data-product="{{P_ID}}">
	<a class="store_card_thumb" href="{{P_URL}}" data-load="?link1=product&id={{P_SLUG}}">
		<?php if (!empty($data['P_IMAGE'])) { ?>
			<img src="{{P_IMAGE}}" alt="{{P_TITLE}}" loading="lazy">
		<?php } else { ?>
			<span class="store_card_noimg"><?php echo PT_StoreBasketIcon(); ?></span>
		<?php } ?>
		<span class="store_status store_status-{{P_STATUS}} store_card_status">{{P_STATUS}}</span>
		<?php if ($data['P_KIND'] === 'service') { ?><span class="store_card_flag">Service</span><?php } ?>
	</a>
	<div class="store_card_body">
		<a class="store_card_title bold black" href="{{P_URL}}" data-load="?link1=product&id={{P_SLUG}}">{{P_TITLE}}</a>
		<div class="store_meta">
			<span class="store_chip"><?php echo ($data['P_KIND'] === 'service') ? 'Service' : 'Product'; ?></span>
		</div>
		<div class="store_card_price"><span class="now main">{{P_CURRENCY}} {{P_PRICE}}</span></div>
		<?php if (!empty($data['P_REJECT'])) { ?><div class="store_card_warn">Not approved: {{P_REJECT}}</div><?php } ?>
		<div class="store_card_cta">
			<button type="button" class="btn btn-sm btn-main store-edit-product" data-id="{{P_ID}}">Edit</button>
			<button type="button" class="btn btn-sm btn-light store-delete-product" data-id="{{P_ID}}">Archive</button>
		</div>
	</div>
</div>
